# ========================================
# Diabetes Prediction System
# ========================================

project:
  name: "Diabetes Prediction System"
  version: "1.0.0"
  description: "An advanced machine learning web application for predicting diabetes risk using multiple ML algorithms"
  type: "Machine Learning Web Application"
  created: "2026-01-23"
  author:
    name: "Prem Sagar Malhotra"
    email: "sagarprem2006@gmail.com"
    github: "https://github.com/premsagar786"
    linkedin: "https://www.linkedin.com/in/prem-sagar-malhotra-99428a348"

# ========================================
# Project Overview
# ========================================

overview:
  purpose: |
    This project provides an intelligent diabetes prediction system that uses 
    three different machine learning algorithms to assess diabetes risk based 
    on diagnostic measurements. The system combines predictions from multiple 
    models using ensemble learning for improved accuracy.
  
  key_features:
    - "Multi-model prediction (KNN, Decision Tree, Neural Network)"
    - "Ensemble learning with majority voting"
    - "Beautiful, modern web interface"
    - "Real-time predictions with confidence scores"
    - "Responsive design for all devices"
    - "Model persistence for fast predictions"
    - "Comprehensive model information page"
  
  use_cases:
    - "Educational tool for understanding ML in healthcare"
    - "Diabetes risk assessment demonstration"
    - "Comparative analysis of ML algorithms"
    - "Portfolio project for ML/AI developers"

# ========================================
# Technical Stack
# ========================================

technology_stack:
  backend:
    language: "Python 3.7+"
    framework: "Flask 3.0.0"
    ml_library: "scikit-learn 1.3.0"
    data_processing: "pandas 2.2.1, numpy 1.26.0"
    model_persistence: "joblib 1.3.2"
  
  frontend:
    html: "HTML5"
    css: "CSS3 with custom properties"
    javascript: "Vanilla JavaScript (ES6+)"
    fonts: "Google Fonts (Inter, Outfit)"
  
  design:
    style: "Modern, Glassmorphism"
    color_scheme: "Dark theme with gradient accents"
    animations: "CSS animations, smooth transitions"
    responsive: "Mobile-first design"

# ========================================
# Machine Learning Models
# ========================================

models:
  knn:
    name: "K-Nearest Neighbors"
    algorithm: "KNeighborsClassifier"
    parameters:
      n_neighbors: 9
      metric: "euclidean"
    description: "Instance-based learning algorithm that classifies based on majority vote of k nearest neighbors"
    strengths:
      - "Simple and intuitive"
      - "No training phase"
      - "Effective for non-linear patterns"
    use_case: "Good for datasets where similar cases have similar outcomes"
  
  decision_tree:
    name: "Decision Tree"
    algorithm: "DecisionTreeClassifier"
    parameters:
      max_depth: 3
      criterion: "gini"
    description: "Tree-based model that makes decisions through a series of feature-based questions"
    strengths:
      - "Highly interpretable"
      - "Handles non-linear relationships"
      - "No data normalization needed"
    use_case: "Excellent for understanding feature importance and decision paths"
  
  mlp:
    name: "Multi-Layer Perceptron (Neural Network)"
    algorithm: "MLPClassifier"
    parameters:
      hidden_layer_sizes: [100, 50]
      max_iter: 500
      random_state: 42
    preprocessing: "StandardScaler normalization"
    description: "Neural network with multiple layers that learns complex patterns"
    strengths:
      - "Captures complex patterns"
      - "High accuracy potential"
      - "Adaptable to various problems"
    use_case: "Best for complex, non-linear relationships in data"
  
  ensemble:
    name: "Ensemble Prediction"
    method: "Majority Voting"
    description: "Combines predictions from all three models for improved reliability"
    voting_strategy: "Hard voting (2 out of 3 agreement)"
    benefits:
      - "More reliable predictions"
      - "Reduces individual model bias"
      - "Leverages multiple perspectives"

# ========================================
# Dataset Information
# ========================================

dataset:
  name: "Pima Indians Diabetes Database"
  source: "National Institute of Diabetes and Digestive and Kidney Diseases"
  url: "https://www.kaggle.com/datasets/uciml/pima-indians-diabetes-database"
  
  statistics:
    total_samples: 768
    features: 8
    target_classes: 2
    class_distribution:
      diabetic: "268 (34.9%)"
      non_diabetic: "500 (65.1%)"
  
  features:
    - name: "Pregnancies"
      description: "Number of times pregnant"
      type: "Integer"
      range: "0-17"
    
    - name: "Glucose"
      description: "Plasma glucose concentration (2 hours in oral glucose tolerance test)"
      type: "Integer"
      unit: "mg/dL"
      range: "0-199"
    
    - name: "BloodPressure"
      description: "Diastolic blood pressure"
      type: "Integer"
      unit: "mm Hg"
      range: "0-122"
    
    - name: "SkinThickness"
      description: "Triceps skin fold thickness"
      type: "Integer"
      unit: "mm"
      range: "0-99"
    
    - name: "Insulin"
      description: "2-Hour serum insulin"
      type: "Integer"
      unit: "μU/mL"
      range: "0-846"
    
    - name: "BMI"
      description: "Body mass index"
      type: "Float"
      unit: "kg/m²"
      range: "0-67.1"
      formula: "weight(kg) / (height(m))²"
    
    - name: "DiabetesPedigreeFunction"
      description: "Diabetes pedigree function (genetic influence)"
      type: "Float"
      range: "0.078-2.42"
    
    - name: "Age"
      description: "Age in years"
      type: "Integer"
      unit: "years"
      range: "21-81"
  
  target:
    name: "Outcome"
    description: "Class variable (0 = non-diabetic, 1 = diabetic)"
    type: "Binary"
    values:
      0: "Non-diabetic"
      1: "Diabetic"

# ========================================
# Project Structure
# ========================================

structure:
  root: "DIBETECS-PREDECTION/"
  directories:
    - path: "models/"
      description: "Machine learning model implementations"
      files:
        - "__init__.py"
        - "knn.py"
        - "decision_tree.py"
        - "mlp.py"
    
    - path: "data/"
      description: "Dataset storage"
      files:
        - "diabetes.csv"
    
    - path: "templates/"
      description: "HTML templates for Flask"
      files:
        - "index.html"
        - "info.html"
    
    - path: "static/"
      description: "Static assets (CSS, JavaScript)"
      files:
        - "style.css"
        - "script.js"
    
    - path: "saved_models/"
      description: "Trained model persistence (auto-generated)"
      files:
        - "knn_model.pkl"
        - "tree_model.pkl"
        - "mlp_model.pkl"
        - "scaler.pkl"
  
  main_files:
    - name: "app.py"
      description: "Flask web application entry point"
    
    - name: "main.py"
      description: "Command-line model training script"
    
    - name: "download_dataset.py"
      description: "Dataset download utility"
    
    - name: "requirements.txt"
      description: "Python dependencies"
    
    - name: "README.md"
      description: "Project documentation"
    
    - name: "project_info.yaml"
      description: "This file - comprehensive project information"
    
    - name: "LICENSE"
      description: "Project license"

# ========================================
# Installation & Setup
# ========================================

installation:
  prerequisites:
    - "Python 3.7 or higher"
    - "pip (Python package manager)"
    - "Git (optional, for cloning)"
  
  steps:
    - step: 1
      title: "Clone or Download Repository"
      commands:
        - "git clone https://github.com/premsagar786/Dibetes-Prediction.git"
        - "cd Dibetes-Prediction"
      alternative: "Download ZIP and extract"
    
    - step: 2
      title: "Install Dependencies"
      commands:
        - "pip install -r requirements.txt"
      note: "This installs Flask, scikit-learn, pandas, numpy, and joblib"
    
    - step: 3
      title: "Download Dataset"
      commands:
        - "python download_dataset.py"
      note: "Downloads the Pima Indians Diabetes dataset"
      optional: true
      reason: "Dataset is included in repository"
    
    - step: 4
      title: "Run the Application"
      commands:
        - "python app.py"
      expected_output: "Flask server starts on http://localhost:5000"
    
    - step: 5
      title: "Access the Application"
      action: "Open web browser and navigate to http://localhost:5000"

# ========================================
# Usage Guide
# ========================================

usage:
  web_interface:
    - step: "Navigate to the home page"
    - step: "Enter patient diagnostic measurements in the form"
    - step: "Click 'Analyze & Predict' button"
    - step: "View predictions from all three models plus ensemble result"
    - step: "Check confidence scores for each prediction"
  
  command_line:
    description: "Train models and view accuracy scores"
    command: "python main.py"
    output: "Displays accuracy for KNN, Decision Tree, and MLP models"
  
  api_endpoints:
    - endpoint: "/"
      method: "GET"
      description: "Home page with prediction form"
    
    - endpoint: "/predict"
      method: "POST"
      description: "Make predictions"
      parameters:
        - "Pregnancies"
        - "Glucose"
        - "BloodPressure"
        - "SkinThickness"
        - "Insulin"
        - "BMI"
        - "DiabetesPedigreeFunction"
        - "Age"
      response: "JSON with predictions from all models"
    
    - endpoint: "/info"
      method: "GET"
      description: "Information page about models and dataset"

# ========================================
# Performance Metrics
# ========================================

performance:
  typical_accuracy:
    knn: "~79%"
    decision_tree: "~75%"
    mlp: "~83%"
    ensemble: "~80-85%"
  
  evaluation_method: "Train-test split (80-20)"
  random_state: 42
  
  notes:
    - "Accuracy may vary slightly based on random seed"
    - "MLP typically achieves highest individual accuracy"
    - "Ensemble method provides most reliable predictions"
    - "Models are evaluated on unseen test data"

